# Deploy — GitHub Pages
name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate environment files
        # Sobreescribe environment.ts y environment.prod.ts (usado por fileReplacements en build)
        # con valores reales de despliegue tomados de secrets/vars, con fallbacks seguros.
        env:
          ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID || vars.ENTRA_CLIENT_ID }}
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID || vars.ENTRA_TENANT_ID }}
          API_URL: ${{ secrets.API_URL || vars.API_URL }}
          REDIRECT_URI: ${{ secrets.REDIRECT_URI || vars.REDIRECT_URI || 'https://Cloud-Native-Convivo.github.io/panel-administracion-web' }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::API_URL no configurada en GitHub Secrets/Vars. Se utilizara endpoint de respaldo demo."
          fi
          if [ -z "$ENTRA_TENANT_ID" ]; then
            echo "::warning::ENTRA_TENANT_ID no configurada en GitHub Secrets/Vars. Se utilizara Tenant ID por defecto."
          fi

          API_URL="${API_URL:-https://x4p5y5i900.execute-api.us-east-1.amazonaws.com}"
          ENTRA_CLIENT_ID="${ENTRA_CLIENT_ID:-8c375036-6298-414a-bc3f-eb0f8fbdf26c}"
          ENTRA_TENANT_ID="${ENTRA_TENANT_ID:-936612c7-66b8-41ba-a9dd-83f50365f818}"
          REDIRECT_URI="${REDIRECT_URI:-https://Cloud-Native-Convivo.github.io/panel-administracion-web}"

          # Normalizar eliminando slash final si existe
          API_URL="${API_URL%/}"
          REDIRECT_URI="${REDIRECT_URI%/}"

          generate_env() {
            cat <<EOF
          export const environment = {
            clientId: '${ENTRA_CLIENT_ID}',
            tenantId: '${ENTRA_TENANT_ID}',
            redirectUri: '${REDIRECT_URI}/',
            postLogoutRedirectUri: '${REDIRECT_URI}/login',
            apiUrl: '${API_URL}',
            apiEspaciosUrl: '${API_URL}/api/v1/espacios-comunes',
            bffBaseUrl: '${API_URL}/api',
          };
          EOF
          }

          generate_env > src/environments/environment.ts
          generate_env > src/environments/environment.prod.ts

      - name: Build
        # pnpm exec (no "pnpm run build -- ..."): pnpm reenvia el "--" al
        # script subyacente en vez de consumirlo como npm, así que "ng build
        # -- --base-href X" le llega a Angular CLI con un "--" de más y lo
        # interpreta como argumento posicional ("Option '--' has been
        # specified multiple times", falla con schema validation error).
        # pnpm exec invoca el binario directo, sin esa capa de reenvío.
        #
        # --base-href: GitHub Pages sirve este repo bajo /panel-administracion-web/,
        # no en la raíz (Pages ya está configurado como sitio de proyecto, no custom
        # domain) -- sin esto todos los assets salen con ruta absoluta rota.
        run: pnpm exec ng build --base-href /panel-administracion-web/

      - name: SPA fallback (rutas de Angular Router en GitHub Pages)
        # Pages sirve estáticos: cualquier ruta que no sea la raíz (ej. /users,
        # /gastos-comunes) da 404 real del hosting al recargar o entrar directo.
        # 404.html = copia de index.html para que Angular Router la resuelva del
        # lado del cliente (mismo patrón que Frontend-CloudNative con react-router).
        run: |
          cp dist/panel-admin/browser/index.html dist/panel-admin/browser/404.html
          touch dist/panel-admin/browser/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/panel-admin/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
