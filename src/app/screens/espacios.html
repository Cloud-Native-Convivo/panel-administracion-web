<div class="h-full overflow-y-auto">
  <div class="p-8">
    <div class="flex items-center justify-between mb-6">
      <p class="text-sm text-gray-400">{{ espacios.length }} espacios registrados en el condominio</p>
      <button class="flex items-center gap-2 bg-[#0D9488] hover:bg-[#005047] text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
        <lucide-icon [img]="icPlus" [size]="16" />
        Agregar espacio
      </button>
    </div>

    <div class="grid grid-cols-3 gap-5">
      @for (e of espacios; track e.id) {
        <div
          (click)="editing.set(e)"
          class="bg-white border border-[#E2E8F0] rounded-xl overflow-hidden hover:border-[#0D9488]/40 hover:shadow-sm transition-all cursor-pointer group"
        >
          <div class="relative h-44 bg-teal-50 overflow-hidden">
            <img [src]="e.img" [alt]="e.name" class="w-full h-full object-cover group-hover:scale-[1.04] transition-transform duration-500" />
            <div class="absolute top-3 left-3">
              <app-status-badge [status]="e.status" />
            </div>
          </div>
          <div class="p-4">
            <h3 class="font-medium text-[#00201B] mb-1">{{ e.name }}</h3>
            <p class="text-xs text-gray-400 mb-3 leading-relaxed">{{ e.desc }}</p>
            <div class="space-y-1.5">
              <div class="flex items-center gap-2 text-xs text-gray-500">
                <lucide-icon [img]="icUsers" [size]="11" class="text-gray-400 flex-shrink-0" />
                {{ e.capacity }}
              </div>
              <div class="flex items-center gap-2 text-xs text-gray-500">
                <lucide-icon [img]="icClock" [size]="11" class="text-gray-400 flex-shrink-0" />
                {{ e.hours }}
              </div>
            </div>
            <div class="mt-3.5 pt-3.5 border-t border-[#E2E8F0] flex gap-1">
              <button
                (click)="$event.stopPropagation(); editing.set(e)"
                class="flex-1 py-1.5 text-xs text-[#0D9488] hover:text-[#005047] font-medium transition-colors"
              >
                Editar
              </button>
              <div class="w-px bg-[#E2E8F0]"></div>
              <button
                (click)="$event.stopPropagation()"
                class="flex-1 py-1.5 text-xs text-gray-500 hover:text-[#00201B] font-medium transition-colors"
              >
                Ver reservas
              </button>
            </div>
          </div>
        </div>
      }

      <!-- Tarjeta para agregar -->
      <div class="border-2 border-dashed border-[#E2E8F0] rounded-xl flex flex-col items-center justify-center p-8 min-h-[272px] cursor-pointer hover:border-[#0D9488]/50 hover:bg-teal-50/20 transition-colors group">
        <div class="w-12 h-12 rounded-full bg-teal-50 group-hover:bg-teal-100 flex items-center justify-center mb-3 transition-colors">
          <lucide-icon [img]="icPlus" [size]="20" class="text-[#0D9488]" />
        </div>
        <p class="text-sm font-medium text-[#0D9488]">Agregar espacio</p>
        <p class="text-xs text-gray-400 mt-0.5">Nuevo espacio común</p>
      </div>
    </div>
  </div>

  <!-- Modal de edición -->
  @if (editing(); as e) {
    <div class="fixed inset-0 bg-black/25 backdrop-blur-[2px] flex items-center justify-center z-50 p-4">
      <div class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-xl">
        <div class="relative h-44 bg-teal-50">
          <img [src]="e.img" [alt]="e.name" class="w-full h-full object-cover" />
          <div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent"></div>
          <button
            (click)="editing.set(null)"
            class="absolute top-3 right-3 w-8 h-8 bg-white rounded-lg flex items-center justify-center shadow-sm hover:bg-gray-50 transition-colors"
          >
            <lucide-icon [img]="icX" [size]="15" />
          </button>
        </div>
        <div class="p-6">
          <h3 class="font-serif text-xl text-[#00201B] mb-5">Editar espacio: {{ e.name }}</h3>
          <div class="space-y-4">
            <app-field-input label="Nombre del espacio" [defaultValue]="e.name" />
            <div class="grid grid-cols-2 gap-4">
              <app-field-input label="Capacidad" [defaultValue]="e.capacity" />
              <div>
                <label class="block text-sm font-medium text-[#00201B] mb-1.5">Estado</label>
                <select
                  class="w-full py-2.5 px-3.5 border border-[#E2E8F0] rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-100 focus:border-[#0D9488] bg-white"
                >
                  <option value="habilitado" [selected]="e.status === 'habilitado'">Habilitado</option>
                  <option value="en mantención" [selected]="e.status === 'en mantención'">En mantención</option>
                </select>
              </div>
            </div>
            <app-field-input label="Horario disponible" [defaultValue]="e.hours" />
            <div>
              <label class="block text-sm font-medium text-[#00201B] mb-1.5">Descripción</label>
              <textarea
                rows="2"
                class="w-full py-2.5 px-3.5 border border-[#E2E8F0] rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-100 focus:border-[#0D9488] resize-none"
              >{{ e.desc }}</textarea>
            </div>
            <div>
              <label class="block text-sm font-medium text-[#00201B] mb-1.5">Fotografía</label>
              <div class="border-2 border-dashed border-[#E2E8F0] rounded-lg px-4 py-3 flex items-center gap-3 hover:border-[#0D9488]/40 transition-colors cursor-pointer">
                <lucide-icon [img]="icCamera" [size]="16" class="text-gray-400" />
                <span class="text-sm text-gray-400">Subir nueva foto</span>
              </div>
            </div>
          </div>
          <div class="flex gap-2 mt-6">
            <button (click)="editing.set(null)" class="flex-1 py-2.5 border border-[#E2E8F0] rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors">
              Cancelar
            </button>
            <button (click)="editing.set(null)" class="flex-1 py-2.5 bg-[#0D9488] hover:bg-[#005047] text-white rounded-lg text-sm font-medium transition-colors">
              Guardar cambios
            </button>
          </div>
        </div>
      </div>
    </div>
  }
</div>
