<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <title>Convivo · Panel de Administración</title>
  <base href="/">
  <script>
    // Contraparte de public/404.html — decodifica la ruta real antes de
    // que Angular Router monte. https://github.com/rafgraph/spa-github-pages
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) {
            return s.replace(/~and~/g, '&');
          })
          .join('?');
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    })(window.location);
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Panel de administración de Convivo para la gestión de condominios, espacios comunes, reservas y comunidad en Chile." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&display=swap">
  <style>
    html, body { height: 100%; margin: 0; }
    app-root { display: block; height: 100%; }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
